<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FI Quest</title>
<meta name="description" content="Financial Institutions Management, Chapters 1 to 7, as a study RPG set in Thailand. Earn baht, rank up, and keep Claude company.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Sarabun:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#FFF4E6; --page:#FFFFFF; --page-2:#FFF8EE; --sunk:#F3E7D3;
  --edge:#2A1E3F; --edge-soft:#D9CDBF; --rule:#D9CDBF; --rule-soft:#EDE3D3;
  --ink:#2A1E3F; --ink-2:#4E4262; --ink-3:#7D7392;
  --accent:#6D3DF5; --accent-ink:#4B22C2; --accent-wash:#EDE6FF;
  --gold:#F5A400; --gold-ink:#9A6300; --gold-wash:#FFF0C7;
  --pink:#FF4F8B; --pink-ink:#C42A63; --pink-wash:#FFE3EC;
  --stamp:#C98A0C; --stamp-wash:#FFF0C7;
  --good:#17A673; --good-wash:#D8F5E9; --bad:#E5484D; --bad-wash:#FFE0E1;
  --c1:#23A455; --c2:#2E7BF0; --c3:#EE4B4B; --c4:#8A4BEA; --c5:#C58A2A; --c6:#E0702F; --c7:#16A8A0;
  --pal:#D96A3C; --pal-deep:#A94520; --pal-line:#2A1E3F; --pal-soft:#FFE8DB; --pal-text:#B3471E; --pal-uni:#3A2E6E;
  --pal-ink:#3A2118; --pal-cheek:#FF8E7A; --pal-hair:#E0703F; --pal-hair-2:#B44E26; --pal-skin:#FFE3CF; --pal-skin-2:#F0C3A6;
  --shadow:4px 4px 0 var(--edge); --shadow-sm:2px 2px 0 var(--edge); --lift:0 14px 30px -18px rgba(42,30,63,.45);
  --display:"Fredoka","Segoe UI Rounded","Arial Rounded MT Bold","Sarabun",sans-serif;
  --body:"Sarabun","Leelawadee UI","Thonburi","Segoe UI",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#120E24; --page:#1C1633; --page-2:#241D40; --sunk:#0F0B1E;
  --edge:#7A69B0; --edge-soft:#3A3160; --rule:#3A3160; --rule-soft:#2E2750;
  --ink:#F4EEFF; --ink-2:#C6BBE3; --ink-3:#8F84AF;
  --accent:#A78BFA; --accent-ink:#C9B8FF; --accent-wash:#2A2150;
  --gold:#FFC53D; --gold-ink:#FFD97A; --gold-wash:#3A2E10;
  --pink:#FF6FA3; --pink-ink:#FF9CC0; --pink-wash:#3F1A2C;
  --stamp:#FFC53D; --stamp-wash:#3A2E10;
  --good:#3DD598; --good-wash:#12301F; --bad:#FF7B80; --bad-wash:#3E1A1C;
  --c1:#4CCB79; --c2:#6BA2FF; --c3:#FF7676; --c4:#B48CFF; --c5:#E4AE55; --c6:#F79A64; --c7:#4FD3CB;
  --pal:#E8804F; --pal-deep:#B95228; --pal-line:#7A69B0; --pal-soft:#3A2418; --pal-text:#FFA982; --pal-uni:#4A3C8C;
  --pal-ink:#3A2118; --pal-cheek:#FF8E7A; --pal-hair:#E8804F; --pal-hair-2:#B95228; --pal-skin:#FFE3CF; --pal-skin-2:#F0C3A6;
  --shadow:4px 4px 0 #0B0817; --shadow-sm:2px 2px 0 #0B0817; --lift:0 14px 30px -14px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --ground:#120E24; --page:#1C1633; --page-2:#241D40; --sunk:#0F0B1E;
  --edge:#7A69B0; --edge-soft:#3A3160; --rule:#3A3160; --rule-soft:#2E2750;
  --ink:#F4EEFF; --ink-2:#C6BBE3; --ink-3:#8F84AF;
  --accent:#A78BFA; --accent-ink:#C9B8FF; --accent-wash:#2A2150;
  --gold:#FFC53D; --gold-ink:#FFD97A; --gold-wash:#3A2E10;
  --pink:#FF6FA3; --pink-ink:#FF9CC0; --pink-wash:#3F1A2C;
  --stamp:#FFC53D; --stamp-wash:#3A2E10;
  --good:#3DD598; --good-wash:#12301F; --bad:#FF7B80; --bad-wash:#3E1A1C;
  --c1:#4CCB79; --c2:#6BA2FF; --c3:#FF7676; --c4:#B48CFF; --c5:#E4AE55; --c6:#F79A64; --c7:#4FD3CB;
  --pal:#E8804F; --pal-deep:#B95228; --pal-line:#7A69B0; --pal-soft:#3A2418; --pal-text:#FFA982; --pal-uni:#4A3C8C;
  --pal-ink:#3A2118; --pal-cheek:#FF8E7A; --pal-hair:#E8804F; --pal-hair-2:#B95228; --pal-skin:#FFE3CF; --pal-skin-2:#F0C3A6;
  --shadow:4px 4px 0 #0B0817; --shadow-sm:2px 2px 0 #0B0817; --lift:0 14px 30px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--edge) 9%,transparent) 1px,transparent 0);background-size:22px 22px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--display)}
.label{font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-3)}
.small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.spread{justify-content:space-between}

/* ---------- HUD ---------- */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(10px);border-bottom:2px solid var(--edge)}
.top-in{max-width:1240px;margin:0 auto;padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:12px;margin-right:auto}
.brand:hover{background:var(--page-2)}
.brand .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--pink));border:2px solid var(--edge);box-shadow:var(--shadow-sm);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:20px}
.brand b{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1}
.brand i{display:block;font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border:2px solid var(--edge);border-radius:999px;background:var(--page);font-family:var(--display);font-weight:600;font-size:14px;white-space:nowrap;box-shadow:var(--shadow-sm);line-height:1.2}
.pill b{font-weight:700;font-variant-numeric:tabular-nums}
.pill .ic{font-size:15px;line-height:1}
.pill.coin{background:var(--gold-wash);color:var(--gold-ink)}
.pill.fire{background:var(--bad-wash);color:var(--bad)}
.pill.fire.cold{background:var(--page);color:var(--ink-3)}
.pill.love{background:var(--pink-wash);color:var(--pink-ink)}
.pill.day{background:var(--good-wash);color:var(--good)}
.pill.bump{animation:bump .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{30%{transform:scale(1.18)}}
.lvl{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:2px solid var(--edge);border-radius:999px;background:var(--page);box-shadow:var(--shadow-sm);cursor:pointer}
.lvl:hover{background:var(--page-2)}
.lvl .n{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;border:2px solid var(--edge)}
.lvl .t{display:flex;flex-direction:column;gap:2px;line-height:1}
.lvl .t b{font-family:var(--display);font-size:13px;font-weight:600}
.pbar{display:block;height:8px;width:110px;border-radius:999px;background:var(--sunk);border:1.5px solid var(--edge);overflow:hidden;position:relative}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .5s cubic-bezier(.2,.9,.3,1.2);border-radius:999px}
.pbar.big{height:16px;width:100%;border-width:2px}
.pbar.big i{background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,color-mix(in srgb,var(--accent) 80%,#fff) 10px 20px);background-size:28px 28px;animation:stripes 1.2s linear infinite}
.pbar.gold i{background:repeating-linear-gradient(-45deg,var(--gold) 0 10px,color-mix(in srgb,var(--gold) 75%,#fff) 10px 20px);background-size:28px 28px;animation:stripes 1.2s linear infinite}
.pbar.pink i{background:repeating-linear-gradient(-45deg,var(--pink) 0 10px,color-mix(in srgb,var(--pink) 78%,#fff) 10px 20px);background-size:28px 28px;animation:stripes 1.2s linear infinite}
.pbar.hue i{background:var(--hue,var(--accent))}
@keyframes stripes{to{background-position:28px 0}}
.ibtn{width:36px;height:36px;border:2px solid var(--edge);border-radius:12px;background:var(--page);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow-sm);font-size:16px}
.ibtn:hover{background:var(--page-2)}
.ibtn:active,.btn:active{transform:translate(2px,2px);box-shadow:none}
.ibtn[aria-pressed="false"]{opacity:.55}
@media (max-width:640px){.hud{gap:6px}.pill{padding:4px 8px;font-size:13px}.lvl .t b{display:none}.lvl .pbar{width:54px}#hud-day{display:none}.ibtn{width:32px;height:32px}}

/* ---------- shell ---------- */
.shell{max-width:1240px;margin:0 auto;padding:22px 16px 140px;display:grid;grid-template-columns:236px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:12px}}
.rail{position:sticky;top:78px;display:flex;flex-direction:column;gap:4px}
.rail .sec{margin:12px 8px 4px}
.rail .sec:first-child{margin-top:0}
.nav{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:7px 10px 7px 7px;border:2px solid transparent;border-radius:14px;background:none;cursor:pointer;color:var(--ink-2)}
.nav:hover{background:var(--page);border-color:var(--edge-soft)}
.nav[aria-current="true"]{background:var(--page);border-color:var(--edge);box-shadow:var(--shadow-sm);color:var(--ink)}
.nav .t{font-family:var(--display);font-size:15px;font-weight:500;line-height:1.15}
.nav[aria-current="true"] .t{font-weight:600}
.nav .sub{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:2px;letter-spacing:.04em}
.nav .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-3);border:1.5px solid var(--edge-soft);border-radius:999px;padding:1px 7px}
.nav .cnt.hot{background:var(--pink);color:#fff;border-color:var(--edge)}
.ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:var(--page-2);border:2px solid var(--edge-soft)}
.nav[aria-current="true"] .ico{border-color:var(--edge)}
.ico.hue{background:var(--hue);color:#fff;border-color:var(--edge);font-family:var(--display);font-weight:700;font-size:11px}
.stars{font-size:11px;letter-spacing:-1px;color:var(--gold);line-height:1}
.stars .off{color:var(--edge-soft)}
@media (max-width:900px){
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:8px;padding:2px 2px 8px;scrollbar-width:none}
  .rail .sec{display:none}
  .nav{flex:none;width:auto;grid-template-columns:auto auto;border-color:var(--edge-soft);background:var(--page)}
  .nav .t{white-space:nowrap}.nav .sub,.nav .cnt{display:none}
}

/* ---------- cards ---------- */
.stage{min-width:0;display:flex;flex-direction:column;gap:18px}
.card{background:var(--page);border:2px solid var(--edge);border-radius:20px;box-shadow:var(--shadow);position:relative}
.card-pad{padding:22px}
@media (max-width:540px){.card-pad{padding:16px}.card{border-radius:16px}}
.card.hue{border-top:8px solid var(--hue,var(--accent))}
.card.flat{box-shadow:none;border-color:var(--edge-soft)}
.head{display:flex;flex-direction:column;gap:6px}
.head h2{font-size:clamp(26px,3.6vw,36px)}
.head p{color:var(--ink-2);max-width:66ch}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1.5px solid var(--edge);background:var(--page-2);white-space:nowrap}
.tag.hue{background:var(--hue);color:#fff}
.tag.gold{background:var(--gold-wash);color:var(--gold-ink)}
.tag.pink{background:var(--pink-wash);color:var(--pink-ink)}
.tag.good{background:var(--good-wash);color:var(--good)}
.tag.bad{background:var(--bad-wash);color:var(--bad)}
.tag.soft{border-color:var(--edge-soft);color:var(--ink-3)}

/* ---------- hero / player card ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);overflow:hidden}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-l{padding:26px;display:flex;flex-direction:column;gap:16px}
.hero-r{position:relative;border-left:2px solid var(--edge);background:linear-gradient(160deg,var(--accent-wash),var(--pink-wash));min-height:260px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
@media (max-width:820px){.hero-r{border-left:0;border-top:2px solid var(--edge);min-height:200px}}
.hero-r canvas{position:absolute;inset:0;width:100%;height:100%}
.hero h1{font-size:clamp(32px,5vw,52px);font-weight:700;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.bigcoin{font-family:var(--display);font-size:clamp(40px,6vw,64px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--gold-ink)}
.bigcoin small{font-size:.5em;margin-right:4px}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border:2px solid var(--edge);border-radius:14px;background:var(--page-2);min-width:100px;box-shadow:var(--shadow-sm)}
.stat b{font-family:var(--display);font-size:22px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.rankcard{position:relative;z-index:1;display:flex;gap:14px;align-items:center;background:var(--page);border:2px solid var(--edge);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.rankcard .ring{width:64px;height:64px;flex:none}
.ring{width:22px;height:22px}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--sunk)}
.ring .fg{stroke:var(--hue,var(--accent));stroke-linecap:round;transition:stroke-dasharray .5s}
.ring text{font-family:var(--display);font-weight:700;fill:var(--ink)}

/* ---------- world map ---------- */
.wmap{display:flex;flex-wrap:wrap;gap:14px 0;align-items:flex-start}
.wnode{flex:1 1 130px;min-width:120px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:none;border:0;cursor:pointer;padding:6px 4px;position:relative}
.wnode:not(:last-child)::after{content:"";position:absolute;top:36px;left:calc(50% + 36px);width:calc(100% - 72px);border-top:3px dashed var(--edge-soft);z-index:0}
.wnode .orb{position:relative;z-index:1;width:68px;height:68px;border-radius:50%;background:var(--hue);border:3px solid var(--edge);box-shadow:var(--shadow-sm);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:15px;transition:transform .15s}
.wnode:hover .orb{transform:translateY(-3px) rotate(-4deg)}
.wnode .orb.done::before{content:"✓";position:absolute;right:-6px;top:-6px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--edge);border:2px solid var(--edge);font-size:13px;display:grid;place-items:center}
.wnode .orb.cur{box-shadow:0 0 0 4px var(--page),0 0 0 7px var(--hue)}
.wnode .wt{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.15}
.wnode .stars{font-size:14px}
.wnode .pbar{width:80px;height:7px}

/* ---------- grids / notes ---------- */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.note{display:flex;flex-direction:column;text-align:left;padding:0;border:2px solid var(--edge);border-radius:18px;background:var(--page);cursor:pointer;overflow:hidden;transition:transform .15s,box-shadow .15s;box-shadow:var(--shadow-sm)}
.note:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow)}
.note .nt{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--hue);color:#fff;border-bottom:2px solid var(--edge)}
.note .nt b{font-family:var(--display);font-size:20px;font-weight:700}
.note .nb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.note h3{font-size:19px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{flex:none;padding:7px 14px;border:2px solid var(--edge-soft);border-radius:999px;background:var(--page);cursor:pointer;font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink-3)}
.tab:hover{color:var(--ink);border-color:var(--edge)}
.tab[aria-selected="true"]{color:#fff;background:var(--hue,var(--accent));border-color:var(--edge);box-shadow:var(--shadow-sm)}

/* ---------- concepts ---------- */
.concepts{display:grid;gap:12px}
.concept{padding:16px 18px;border:2px solid var(--edge-soft);border-radius:16px;background:var(--page);display:grid;gap:8px}
.concept h3{font-size:21px}
.concept p{max-width:70ch;color:var(--ink-2)}
.concept p b{color:var(--ink);font-weight:700}
.thai{border:2px dashed color-mix(in srgb,var(--c2) 60%,var(--rule));background:color-mix(in srgb,var(--c2) 8%,var(--page));border-radius:12px;padding:10px 12px;max-width:70ch;font-size:15px;color:var(--ink-2)}
.thai .label{color:var(--c2);display:block;margin-bottom:2px}
.formula{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:4px 16px;padding:10px 12px;border:2px solid var(--edge-soft);border-radius:12px;font-size:15px;margin-bottom:8px;background:var(--page)}
.formula code{font-family:var(--mono);font-size:13.5px;color:var(--accent-ink)}
@media (max-width:540px){.formula{grid-template-columns:1fr}}

/* ---------- buttons, fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border:2px solid var(--edge);border-radius:14px;background:var(--page);cursor:pointer;font-family:var(--display);font-weight:600;font-size:15px;box-shadow:var(--shadow-sm);transition:transform .08s,box-shadow .08s;color:var(--ink);line-height:1.2}
.btn:hover{background:var(--page-2)}
.btn.primary{background:var(--accent);border-color:var(--edge);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);color:var(--edge)}
.btn.pink{background:var(--pink);color:#fff}
.btn.good{background:var(--good);color:#fff}
.btn.ghost{box-shadow:none;border-color:var(--edge-soft)}
.btn.sm{padding:5px 11px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:var(--shadow-sm)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--ink-3);font-weight:600;font-family:var(--display)}
input[type=number],input[type=text],select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--page);border:2px solid var(--edge);border-radius:12px;padding:9px 12px;width:100%}
input[type=number]{font-family:var(--mono)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
textarea{resize:vertical;min-height:110px;line-height:1.5}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}

/* ---------- ledger tables (kept for labs) ---------- */
.ledger{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.ledger th{font-weight:600;text-align:left;color:var(--ink-3);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;border-bottom:2px solid var(--edge-soft)}
.ledger td{padding:7px 8px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
.ledger td.r,.ledger th.r{text-align:right}
.ledger .cr{color:var(--good);font-weight:700}
.tablewrap{overflow-x:auto}

/* ---------- flashcard ---------- */
.flash{perspective:1200px;max-width:620px;margin:8px auto 0;width:100%}
.flash-in{position:relative;min-height:230px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid var(--edge);border-radius:18px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:10px;background:var(--page);box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:var(--accent-wash)}
.face .big{font-family:var(--display);font-size:clamp(22px,3.4vw,30px);line-height:1.2;font-weight:600}

/* ---------- questions ---------- */
.q{display:flex;flex-direction:column;gap:14px}
.q-prompt{font-size:18.5px;line-height:1.5;max-width:68ch;font-weight:500}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:2px solid var(--edge-soft);border-radius:14px;background:var(--page);cursor:pointer;font-size:15.5px;transition:transform .08s}
.opt:hover:not(:disabled){border-color:var(--edge);background:var(--page-2);transform:translateX(3px)}
.opt .k{width:28px;height:28px;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;background:var(--page-2)}
.opt.right{border-color:var(--good);background:var(--good-wash)}
.opt.right .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-wash);animation:shake .4s}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.opt:disabled{cursor:default}
.explain{border:2px solid var(--edge-soft);border-left-width:6px;border-radius:14px;padding:10px 14px;background:var(--page-2);font-size:15px;color:var(--ink-2);max-width:72ch}
.explain.ok{border-color:var(--good)}
.explain.no{border-color:var(--bad)}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow input{max-width:220px}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:2px dashed var(--edge-soft);padding-top:14px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--edge-soft);background:var(--page);padding:0;cursor:pointer}
.dot.ok{background:var(--good);border-color:var(--good)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.cur{outline:2px solid var(--edge);outline-offset:1px}
.combo{display:flex;align-items:center;gap:10px;padding:8px 12px;border:2px solid var(--edge);border-radius:14px;background:var(--page-2);font-family:var(--display);font-weight:600;box-shadow:var(--shadow-sm)}
.combo .pbar{flex:1;width:auto;height:10px}
.combo.hot{background:var(--bad-wash);border-color:var(--bad)}
.combo .mult{font-size:18px;color:var(--bad)}

/* ---------- stamps / seals ---------- */
.stamp{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;border:3px solid var(--stamp);color:var(--stamp);font-family:var(--display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.15;transform:rotate(-10deg);position:relative;background:var(--stamp-wash);font-weight:700}
.stamp::after{content:"";position:absolute;inset:5px;border:1.5px dashed var(--stamp);border-radius:50%}
.stamp b{display:block;font-size:18px;letter-spacing:0;text-transform:none}
.stamp.off{border-color:var(--edge-soft);color:var(--ink-3);border-style:dashed;background:transparent}
.stamp.off::after{border-color:var(--rule-soft)}
.stamp.pop{animation:thump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes thump{0%{transform:rotate(-10deg) scale(2);opacity:0}100%{transform:rotate(-10deg) scale(1);opacity:1}}

/* ---------- cases ---------- */
.case-card{display:grid;grid-template-columns:auto 1fr;gap:14px;text-align:left;padding:16px;border:2px solid var(--edge-soft);border-radius:18px;background:var(--page);cursor:pointer;transition:transform .12s}
.case-card:hover{border-color:var(--edge);box-shadow:var(--shadow-sm);transform:translate(-1px,-1px)}
.yr{font-family:var(--display);font-size:24px;font-weight:700;line-height:1;min-width:88px;color:var(--accent-ink)}
.flag{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 8px;border-radius:999px;border:1.5px solid var(--edge-soft);color:var(--ink-3)}
.flag.th{border-color:var(--c2);color:var(--c2)}
.denom{font-family:var(--display);font-size:11px;font-weight:700;min-width:44px;text-align:center;padding:2px 7px;border-radius:999px;color:#fff;background:var(--hue,var(--ink-3));border:1.5px solid var(--edge)}
.timeline{display:grid;gap:0;margin:4px 0}
.tl{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:8px 0;border-bottom:1px dashed var(--rule)}
.tl span:first-child{font-family:var(--mono);font-size:12.5px;color:var(--accent-ink);font-weight:600}
@media (max-width:540px){.tl{grid-template-columns:1fr;gap:0}}
.story p{max-width:70ch;color:var(--ink-2);margin-bottom:10px}
.grade{border:2px solid var(--edge-soft);border-radius:14px;padding:14px;background:var(--page-2);display:flex;flex-direction:column;gap:8px}

/* ---------- reference ---------- */
.crisis{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;padding:18px 0;border-bottom:2px dashed var(--rule-soft)}
.crisis:last-child{border-bottom:0}
.crisis-era{font-size:13px;color:var(--ink-3);padding-top:3px}
@media (max-width:620px){.crisis{grid-template-columns:minmax(0,1fr);gap:8px}}
.rosetta{width:100%;border-collapse:collapse;font-size:14.5px}
.rosetta th{text-align:left;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;border-bottom:2px solid var(--edge-soft)}
.rosetta td{padding:9px 10px;border-bottom:1px dashed var(--rule);vertical-align:top}
.rosetta td:first-child{font-weight:700;min-width:150px}
.rosetta td:last-child{color:var(--c2)}

/* ---------- lab (labs.js markup) ---------- */
.lab{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px}
@media (max-width:760px){.lab{grid-template-columns:minmax(0,1fr)}}
.readouts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.ro{border:2px solid var(--edge);border-radius:14px;padding:10px 12px;background:var(--page-2);box-shadow:var(--shadow-sm)}
.ro .v{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.chip{display:inline-block;font-family:var(--display);font-weight:600;font-size:12px;padding:2px 9px;border-radius:999px;border:1.5px solid var(--edge-soft)}
.chip.ok{border-color:var(--good);color:var(--good);background:var(--good-wash)}
.chip.no{border-color:var(--bad);color:var(--bad);background:var(--bad-wash)}
.marks{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.marks li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;color:var(--ink-2);max-width:74ch}
.marks .chip{margin-top:2px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--sunk);border-radius:999px;overflow:hidden;border:1.5px solid var(--edge)}
.bar .track i{display:block;height:100%;background:var(--hue,var(--accent));transition:width .35s}
svg text{font-family:var(--mono)}

/* ---------- tiers, filters, sorters ---------- */
.tier{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 8px;border-radius:999px;border:1.5px solid;white-space:nowrap}
.tier.e{color:var(--good);border-color:var(--good);background:var(--good-wash)}
.tier.m{color:var(--gold-ink);border-color:var(--gold);background:var(--gold-wash)}
.tier.d{color:var(--bad);border-color:var(--bad);background:var(--bad-wash)}
.src{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);border:1.5px dashed var(--edge-soft);padding:1px 7px;border-radius:999px;white-space:nowrap}
.filter{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filter .btn{padding:5px 12px;font-size:13.5px;border-radius:999px}
.filter .btn[aria-pressed="true"],.filter .btn.primary{background:var(--edge);color:var(--page);border-color:var(--edge)}
.tierstats{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink-3);align-items:center}
.helpers{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.helpers .btn{padding:5px 11px;font-size:13.5px;border-radius:10px}
.sorter{border:2px solid var(--edge);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.sorter-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--page-2);border-bottom:2px solid var(--edge)}
.sorter-card{padding:26px 20px;font-size:19px;line-height:1.45;min-height:110px;font-weight:500;font-family:var(--display)}
.sorter-sides{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 16px}
.sorter-why{margin:0 18px 16px}

/* ---------- quests / trophies ---------- */
.quest{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--edge-soft);border-radius:16px;background:var(--page)}
.quest.done{border-color:var(--good);background:var(--good-wash)}
.quest.claimed{opacity:.6}
.quest .qi{width:44px;height:44px;border-radius:14px;background:var(--accent-wash);border:2px solid var(--edge);display:grid;place-items:center;font-size:20px}
.quest.done .qi{background:var(--good);color:#fff}
.quest .qt{font-family:var(--display);font-weight:600;font-size:15.5px}
.quest .pbar{width:100%;max-width:260px;height:9px;margin-top:6px}
.quest .rw{font-family:var(--display);font-weight:700;font-size:13px;color:var(--gold-ink);white-space:nowrap}
.trophies{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.trophy{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 10px;border:2px solid var(--edge);border-radius:18px;background:var(--page);box-shadow:var(--shadow-sm)}
.trophy .ti{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--pink));border:2.5px solid var(--edge);display:grid;place-items:center;font-size:26px}
.trophy b{font-family:var(--display);font-size:14px;font-weight:600;line-height:1.15}
.trophy .small{font-size:12.5px;color:var(--ink-3);line-height:1.3}
.trophy.locked{opacity:.55;box-shadow:none;border-style:dashed;border-color:var(--edge-soft)}
.trophy.locked .ti{background:var(--sunk);filter:grayscale(1)}
.trophy.new{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
.days{display:flex;gap:6px}
.days span{width:30px;height:30px;border-radius:10px;border:2px solid var(--edge-soft);display:grid;place-items:center;font-family:var(--display);font-size:11px;font-weight:700;color:var(--ink-3)}
.days span.on{background:var(--good);color:#fff;border-color:var(--edge)}
.days span.today{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- boss ---------- */
.boss{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:2px solid var(--edge);border-radius:18px;background:linear-gradient(135deg,var(--page-2),var(--bad-wash));box-shadow:var(--shadow)}
.boss .bn{font-family:var(--display);font-weight:700;font-size:20px}
.hearts{font-size:18px;letter-spacing:2px;color:var(--pink)}
.hearts .lost{opacity:.25}
.rankbig{font-family:var(--display);font-size:clamp(64px,12vw,120px);font-weight:700;line-height:1;background:linear-gradient(135deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- chat ---------- */
.chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:90%;padding:9px 13px;border-radius:14px;font-size:15px;white-space:pre-wrap;line-height:1.5;border:2px solid var(--edge-soft)}
.msg.me{align-self:flex-end;background:var(--accent-wash);color:var(--ink);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--page-2);border-bottom-left-radius:4px}
.msg.sys{align-self:center;font-size:12.5px;color:var(--ink-3);background:none;padding:0;border:0}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.quick button{font-size:12.5px;padding:4px 10px;border:1.5px solid var(--edge);border-radius:999px;background:var(--page);cursor:pointer;font-family:var(--display);font-weight:600}
.chat-f{display:flex;gap:8px;padding:10px 14px;border-top:2px solid var(--edge)}
.chat-f textarea{min-height:42px;height:42px}

/* ---------- companion: Claude ---------- */
.pal{position:fixed;left:0;top:0;z-index:75;width:84px;height:84px;will-change:transform;pointer-events:none}
.pal-body{pointer-events:auto;width:100%;height:100%;padding:0;border:0;background:none;cursor:grab;touch-action:none;display:block;border-radius:50%}
.pal.held .pal-body{cursor:grabbing}
.pal-svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 7px rgba(0,0,0,.25));animation:palbob 3.6s ease-in-out infinite}
@keyframes palbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pal .halo{transform-box:fill-box;transform-origin:center;animation:palspin 22s linear infinite}
@keyframes palspin{to{transform:rotate(360deg)}}
.pal .tuft{transform-box:fill-box;animation:tuftL 2.4s ease-in-out infinite alternate}
.pal .tl{transform-origin:100% 0%}
.pal .tr{transform-origin:0% 0%;animation-name:tuftR}
@keyframes tuftL{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@keyframes tuftR{from{transform:rotate(4deg)}to{transform:rotate(-5deg)}}
.pal .eyes-in{transform-box:fill-box;transform-origin:center;animation:palblink 5.6s infinite}
@keyframes palblink{0%,95.5%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.08)}}
.pal .mouth,.pal .brow,.pal .acc,.pal .fx{display:none}
.mood-happy .m-happy,.mood-smug .m-smug,.mood-fluster .m-fluster,.mood-sad .m-sad,.mood-intense .m-intense,.mood-love .m-love,.mood-sleepy .m-sleepy,
.mood-happy .b-happy,.mood-smug .b-smug,.mood-fluster .b-fluster,.mood-sad .b-sad,.mood-intense .b-intense,.mood-love .b-love,.mood-sleepy .b-sleepy{display:inline}
.mood-fluster .blush,.mood-love .blush{opacity:.95}
.mood-sad .blush{opacity:.3}
.mood-love .fx-hearts{display:inline}
.mood-sleepy .eyes-in{animation:none;transform:scaleY(.35)}
.pal .fx-hearts{transform-box:fill-box;transform-origin:center;animation:floatup 1.6s ease-in-out infinite}
@keyframes floatup{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.wear-ribbon .acc-ribbon,.wear-glasses .acc-glasses,.wear-flower .acc-flower,.wear-crown .acc-crown,.wear-scarf .acc-scarf{display:inline}
.pal.hop .pal-body{animation:palhop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes palhop{0%{transform:scale(1)}30%{transform:scale(1.14) translateY(-8px)}100%{transform:scale(1)}}
.pal.wiggle .pal-body{animation:palwig .6s ease-in-out}
@keyframes palwig{20%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(8deg) scale(1.05)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
.pal.spin .pal-body{animation:palspin2 .7s cubic-bezier(.3,1.4,.5,1)}
@keyframes palspin2{to{transform:rotate(360deg)}}
.pal-body:hover .pal-svg{animation-duration:1.4s}
@media (max-width:560px){.pal{width:66px;height:66px}}
@media (prefers-reduced-motion:reduce){.pal-svg,.pal .tuft,.pal .halo,.pal .eyes-in,.pal .fx-hearts{animation:none}}
.pal-bubble{position:fixed;left:0;top:0;z-index:76;background:var(--page);color:var(--ink);border:2px solid var(--edge);border-radius:16px;box-shadow:var(--shadow);padding:8px 12px 12px;font-size:14.5px;line-height:1.5}
.pal-bubble.pop{animation:palpop .28s cubic-bezier(.3,1.5,.5,1)}
@keyframes palpop{from{transform:scale(.9) translateY(6px)}to{transform:none}}
.pal-b-h{display:flex;align-items:center;gap:8px}
.pal-b-t b{color:var(--pal-text)}
.pal-x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:13px;padding:2px 4px}
.pal-bubble .btn{padding:4px 10px;font-size:13px}
.pal-panel{position:fixed;left:0;top:0;z-index:74;width:300px;display:flex;flex-direction:column;gap:10px;background:var(--page);border:2px solid var(--edge);border-radius:18px;box-shadow:var(--shadow);padding:14px}
.pal-panel.sheet{left:8px!important;right:8px;top:auto!important;bottom:8px;width:auto!important}
.pal-panel .face{position:static;inset:auto;border:0;padding:0;box-shadow:none;background:none;display:inline;font-family:var(--mono);color:var(--pal-text);font-size:14px}
.pal-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pal-acts .btn{padding:8px 10px;font-size:14px}
.bondname{font-family:var(--display);font-weight:600;font-size:14px;color:var(--pink-ink)}
.pal-chat{position:fixed;left:0;top:0;z-index:74;display:flex;flex-direction:column;background:var(--page);border:2px solid var(--edge);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.pal-chat.sheet{left:8px!important;right:8px;top:auto!important;bottom:8px;width:auto!important;height:72vh!important}
.pal-chat-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:2px solid var(--edge);background:var(--page-2)}
.pal-face{color:var(--pal-text);font-size:13px}
.gift{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--edge-soft);border-radius:14px;background:var(--page)}
.gift .gi{font-size:26px;text-align:center}
.gift b{font-family:var(--display);font-weight:600}
.gift.owned{border-color:var(--pink);background:var(--pink-wash)}
.pcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.pcard{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 10px;border:2px solid var(--edge-soft);border-radius:18px;background:var(--page);cursor:pointer;transition:transform .12s}
.pcard:hover{border-color:var(--edge);transform:translateY(-2px)}
.pcard.on{border-color:var(--pink);box-shadow:var(--shadow);background:var(--pink-wash)}
.pcard b{font-family:var(--display);font-size:17px;font-weight:600}
.pmini{position:static;width:96px;height:96px;pointer-events:none}
.pmini.big{width:200px;height:200px}
.studio{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:22px;align-items:start}
@media (max-width:700px){.studio{grid-template-columns:minmax(0,1fr)}}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--edge-soft);cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px var(--page)}
.sw:hover{border-color:var(--edge)}
.sw.on{border-color:var(--edge);outline:3px solid var(--pink);outline-offset:1px}
.sw.custom{display:grid;place-items:center;background:var(--page-2);font-weight:700;position:relative;overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

/* ---------- cram / glossary / plan ---------- */
.terms{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.term{padding:10px 12px;border:2px solid var(--edge-soft);border-radius:14px;background:var(--page);cursor:pointer;text-align:left}
.term b{font-family:var(--display);font-weight:600;display:block}
.term p{font-size:14px;color:var(--ink-2);margin-top:4px}
.term.hide p{filter:blur(6px);user-select:none}
.term.hide:hover p,.term.hide:focus p{filter:none}
.traps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.traps li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px;border:2px solid var(--bad);border-radius:14px;background:var(--bad-wash);font-size:15px}
.traps li::before{content:"⚠";font-size:16px}
.must{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.must li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 12px;border:2px solid var(--edge-soft);border-radius:12px;font-size:14.5px}
.must li::before{content:"★";color:var(--gold)}
.frame{border:2px dashed var(--accent);background:var(--accent-wash);border-radius:14px;padding:12px 14px;font-size:15px}
.dayrow{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:14px;border:2px solid var(--edge);border-radius:16px;background:var(--page);box-shadow:var(--shadow-sm)}
.dayrow .dn{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;color:var(--accent)}
.dayrow ul{margin:6px 0 0;padding-left:18px;font-size:14.5px;color:var(--ink-2)}
.dayrow.done{background:var(--good-wash);border-color:var(--good)}
.ready{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ready .stat b{font-size:20px}

/* ---------- fx ---------- */
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--edge);color:var(--page);padding:9px 16px;border-radius:999px;font-size:14px;font-family:var(--display);font-weight:600;animation:rise .3s ease;border:2px solid var(--page);box-shadow:var(--lift)}
.toast.gold{background:var(--gold);color:var(--edge)}
.toast.pink{background:var(--pink);color:#fff}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.float{position:fixed;z-index:85;pointer-events:none;font-family:var(--display);font-weight:700;font-size:20px;color:var(--gold-ink);text-shadow:0 2px 0 var(--page),0 0 8px var(--page);animation:floaty 1.1s ease-out forwards}
.float.xp{color:var(--accent);font-size:16px}
.float.love{color:var(--pink)}
.float.bad{color:var(--bad)}
@keyframes floaty{0%{transform:translateY(0) scale(.7);opacity:0}15%{opacity:1;transform:translateY(-8px) scale(1.15)}100%{transform:translateY(-56px) scale(1);opacity:0}}
#confetti{position:fixed;inset:0;z-index:90;pointer-events:none}
.overlay{position:fixed;inset:0;z-index:95;background:color-mix(in srgb,var(--edge) 55%,transparent);display:grid;place-items:center;padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.overlay .card{max-width:440px;width:100%;text-align:center;padding:28px 24px;display:flex;flex-direction:column;gap:12px;align-items:center;animation:palpop .4s cubic-bezier(.3,1.5,.5,1)}
.overlay .rankbig{font-size:clamp(56px,10vw,96px)}
.overlay .kicker{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}
</style>
</head>

    <div class="hud">
      <button type="button" class="lvl" id="hud-lvl" title="Your rank and XP. Click for the trophy room"><span class="n" id="hud-lvl-n">1</span><span class="t"><b id="hud-lvl-t">Trainee Teller</b><span class="pbar"><i id="hud-xp" style="width:0%"></i></span></span></button>
      <span class="pill coin" id="hud-coin" title="Baht balance: earned by answering, spent on gifts for Claude"><span class="ic">฿</span><b id="hud-bal">0</b></span>

      <button class="ibtn" id="btn-quiet" aria-label="Mute or unmute Claude's chatter" title="Claude talks / quiet">💬</button>
      <button class="ibtn" id="btn-theme" aria-label="Switch light or dark theme" title="Light / dark">◐</button>
      <button class="ibtn" id="btn-reset" aria-label="Reset all progress" title="Reset progress">↺</button>
    </div>
  </div>
</header>

<div class="shell">
