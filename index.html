<title>The FI Passbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Sarabun:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#E6ECE3; --page:#F8FAF5; --page-2:#EEF3EA; --sunk:#DFE6DA;
  --rule:#C7D2C1; --rule-soft:#DCE4D6;
  --ink:#16202A; --ink-2:#3B4951; --ink-3:#66756F;
  --accent:#24406E; --accent-ink:#1B315A; --accent-wash:#DCE3EF;
  --stamp:#5B3FA3; --stamp-wash:#E8E2F4;
  --good:#2C6A43; --good-wash:#DBEADF; --bad:#A6352E; --bad-wash:#F4DFDB;
  --c1:#3A7A4B; --c2:#2B5C99; --c3:#AE3A38; --c4:#6A4692; --c5:#86653A;
  --sat:#DDA73A; --sat-deep:#94640F; --sat-line:#CFA14A; --sat-soft:#F5EACB; --sat-text:#86590B; --sat-ink:#3A2708; --sat-cheek:#E98A73;
  --shadow:0 1px 1px rgba(22,32,42,.05),0 10px 30px -16px rgba(22,32,42,.25);
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Sarabun","Leelawadee UI","Thonburi","Segoe UI",Arial,sans-serif;
  --mono:"DM Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1215; --page:#151C20; --page-2:#1B2429; --sunk:#10171A;
  --rule:#2B383D; --rule-soft:#223035;
  --ink:#E5ECE5; --ink-2:#AEBDB5; --ink-3:#7E8E87;
  --accent:#93ACDD; --accent-ink:#B9CBEE; --accent-wash:#1D2A3E;
  --stamp:#B8A3EE; --stamp-wash:#271F3D;
  --good:#6FC48F; --good-wash:#15301F; --bad:#EF8B7F; --bad-wash:#3A1C18;
  --c1:#6DB883; --c2:#74A0E3; --c3:#E57D76; --c4:#AC8DD8; --c5:#CDA86E;
  --sat:#E4B355; --sat-deep:#9C6E1A; --sat-line:#8C6A2A; --sat-soft:#33280F; --sat-text:#EDC271; --sat-ink:#2B1C05; --sat-cheek:#E48E78;
  --shadow:0 1px 1px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --ground:#0D1215; --page:#151C20; --page-2:#1B2429; --sunk:#10171A;
  --rule:#2B383D; --rule-soft:#223035;
  --ink:#E5ECE5; --ink-2:#AEBDB5; --ink-3:#7E8E87;
  --accent:#93ACDD; --accent-ink:#B9CBEE; --accent-wash:#1D2A3E;
  --stamp:#B8A3EE; --stamp-wash:#271F3D;
  --good:#6FC48F; --good-wash:#15301F; --bad:#EF8B7F; --bad-wash:#3A1C18;
  --c1:#6DB883; --c2:#74A0E3; --c3:#E57D76; --c4:#AC8DD8; --c5:#CDA86E;
  --sat:#E4B355; --sat-deep:#9C6E1A; --sat-line:#8C6A2A; --sat-soft:#33280F; --sat-text:#EDC271; --sat-ink:#2B1C05; --sat-cheek:#E48E78;
  --shadow:0 1px 1px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;margin:0;line-height:1.12;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.small{font-size:14px}

/* top bar */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.top-in{max-width:1220px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{margin-right:auto;display:flex;align-items:baseline;gap:10px;background:none;border:0;cursor:pointer;padding:0}
.brand b{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.brand i{font-style:normal;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:baseline;padding:4px 10px;border:1px solid var(--rule);border-radius:4px;background:var(--page);font-family:var(--mono);font-size:12px;white-space:nowrap}
.pill b{font-weight:500;color:var(--ink)}
.pill.bal{border-color:color-mix(in srgb,var(--accent) 45%,var(--rule));color:var(--accent-ink)}
.ibtn{width:34px;height:34px;border:1px solid var(--rule);border-radius:4px;background:var(--page);cursor:pointer;display:grid;place-items:center}
.ibtn:hover{border-color:var(--ink-3)}

/* shell */
.shell{max-width:1220px;margin:0 auto;padding-block:22px 120px;padding-inline:16px;display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr);gap:14px}}
.rail{position:sticky;top:72px;display:flex;flex-direction:column;gap:2px}
.rail .sec{margin:14px 8px 6px}
.rail .sec:first-child{margin-top:0}
.nav{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border:1px solid transparent;border-radius:4px;background:none;cursor:pointer}
.nav:hover{background:var(--page-2)}
.nav[aria-current="true"]{background:var(--page);border-color:var(--rule);box-shadow:var(--shadow)}
.nav .t{font-size:14.5px;line-height:1.25;color:var(--ink-2)}
.nav[aria-current="true"] .t{color:var(--ink);font-weight:600}
.denom{font-family:var(--mono);font-size:10.5px;font-weight:500;min-width:44px;text-align:center;padding:2px 4px;border-radius:2px;color:var(--page);background:var(--hue,var(--ink-3))}
.glyph{font-family:var(--display);font-size:15px;min-width:44px;text-align:center;color:var(--ink-3)}
@media (max-width:900px){
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .rail .sec{display:none}
  .nav{flex:none;width:auto;border-color:var(--rule);background:var(--page)}
  .nav .t{white-space:nowrap}
}
.ring{width:22px;height:22px}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--sunk)}
.ring .fg{stroke:var(--hue,var(--accent));stroke-linecap:round;transition:stroke-dasharray .5s}

/* passbook page */
.stage{min-width:0;display:flex;flex-direction:column;gap:20px}
.leaf{background:var(--page);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);position:relative}
.leaf-pad{padding:24px}
@media (max-width:540px){.leaf-pad{padding:16px}}
.ruled{background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule-soft) 31px 32px)}
.head{display:flex;flex-direction:column;gap:6px}
.head h2{font-size:clamp(26px,3.6vw,36px)}
.head p{color:var(--ink-2);max-width:66ch}
.band{height:6px;border-radius:6px 6px 0 0;background:var(--hue,var(--accent))}

/* hero */
.cover{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0;overflow:hidden}
@media (max-width:820px){.cover{grid-template-columns:minmax(0,1fr)}}
.cover-l{padding:26px 26px 22px;display:flex;flex-direction:column;gap:14px}
.cover-r{position:relative;border-left:1px solid var(--rule);background:var(--page-2);min-height:260px}
@media (max-width:820px){.cover-r{border-left:0;border-top:1px solid var(--rule);min-height:180px}}
.cover-r canvas{position:absolute;inset:0;width:100%;height:100%}
.cover-r .seal{position:absolute;left:18px;bottom:14px;right:18px;display:flex;justify-content:space-between;gap:8px}
.cover h1{font-size:clamp(34px,5.4vw,56px);font-weight:500;letter-spacing:-.025em}
.cover h1 em{font-style:italic;color:var(--accent)}
.bal-big{font-family:var(--display);font-size:clamp(40px,6vw,62px);font-weight:700;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.bal-big small{font-size:.45em;color:var(--ink-3);font-weight:500;margin-right:6px}

/* ledger */
.ledger{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.ledger th{font-weight:500;text-align:left;color:var(--ink-3);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--rule)}
.ledger td{padding:6px 8px;border-bottom:1px dotted var(--rule);vertical-align:top}
.ledger td.r,.ledger th.r{text-align:right}
.ledger .cr{color:var(--good)}
.tablewrap{overflow-x:auto}

/* grids */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.note{display:flex;flex-direction:column;gap:10px;text-align:left;padding:0;border:1px solid var(--rule);border-radius:6px;background:var(--page);cursor:pointer;overflow:hidden;transition:transform .15s,box-shadow .15s}
.note:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.note .nt{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--hue);color:var(--page)}
.note .nt b{font-family:var(--display);font-size:22px;font-weight:700}
.note .nb{padding:4px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.note h3{font-size:19px}
.meter{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-top:auto}
.meter i{display:block;height:100%;background:var(--hue,var(--accent));transition:width .5s}

/* tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.tab{flex:none;padding:10px 14px;border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;font-weight:600;font-size:14.5px;color:var(--ink-3);margin-bottom:-1px}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--hue,var(--accent))}

/* concepts */
.concepts{display:grid;gap:0}
.concept{padding:18px 0;border-bottom:1px solid var(--rule-soft);display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.concept:last-child{border-bottom:0}
.concept h3{font-size:21px}
.concept p{max-width:70ch;color:var(--ink-2)}
.concept p b{color:var(--ink);font-weight:600}
.thai{border:1px dashed color-mix(in srgb,var(--c2) 55%,var(--rule));background:color-mix(in srgb,var(--c2) 7%,var(--page));border-radius:4px;padding:10px 12px;max-width:70ch;font-size:15px;color:var(--ink-2)}
.thai .label{color:var(--c2);display:block;margin-bottom:2px}
.formula{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:4px 16px;padding:10px 0;border-bottom:1px dotted var(--rule);font-size:15px}
.formula code{font-family:var(--mono);font-size:13.5px;color:var(--accent-ink)}
@media (max-width:540px){.formula{grid-template-columns:1fr}}

/* buttons, fields */
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--rule);border-radius:4px;background:var(--page);cursor:pointer;font-weight:600;font-size:14.5px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--page)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--ink-3);font-weight:500}
input[type=number],input[type=text],select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--page);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;width:100%}
input[type=number]{font-family:var(--mono)}
input[type=range]{width:100%;accent-color:var(--accent)}
textarea{resize:vertical;min-height:110px;line-height:1.5}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}

/* flashcard */
.flash{perspective:1200px;max-width:620px;margin:8px auto 0;width:100%}
.flash-in{position:relative;min-height:230px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--rule);border-radius:6px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:10px;background:var(--page)}
.face.back{transform:rotateY(180deg);background:var(--page-2)}
.face .big{font-family:var(--display);font-size:clamp(22px,3.4vw,30px);line-height:1.2}

/* questions */
.q{display:flex;flex-direction:column;gap:14px}
.q-prompt{font-size:18px;line-height:1.5;max-width:68ch}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--page);cursor:pointer;font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--ink-3);background:var(--page-2)}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--ink-3);padding-top:2px}
.opt.right{border-color:var(--good);background:var(--good-wash)}
.opt.wrong{border-color:var(--bad);background:var(--bad-wash)}
.opt:disabled{cursor:default}
.explain{border-left:3px solid var(--ink-3);padding:8px 14px;background:var(--page-2);font-size:15px;color:var(--ink-2);max-width:70ch}
.explain.ok{border-color:var(--good)}
.explain.no{border-color:var(--bad)}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow input{max-width:220px}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--rule-soft);padding-top:14px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--rule);background:var(--page);padding:0;cursor:pointer}
.dot.ok{background:var(--good);border-color:var(--good)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.cur{outline:2px solid var(--ink-3);outline-offset:1px}

/* stamp */
.stamp{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;border:2.5px solid var(--stamp);color:var(--stamp);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-align:center;line-height:1.2;transform:rotate(-12deg);position:relative;background:transparent}
.stamp::after{content:"";position:absolute;inset:4px;border:1px solid var(--stamp);border-radius:50%}
.stamp b{display:block;font-family:var(--display);font-size:17px;letter-spacing:0;text-transform:none}
.stamp.off{border-color:var(--rule);color:var(--ink-3);border-style:dashed}
.stamp.off::after{border-color:var(--rule-soft)}
.stamp.pop{animation:thump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes thump{0%{transform:rotate(-12deg) scale(1.9);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:1}}

/* cases */
.case-card{display:grid;grid-template-columns:auto 1fr;gap:14px;text-align:left;padding:16px;border:1px solid var(--rule);border-radius:6px;background:var(--page);cursor:pointer}
.case-card:hover{border-color:var(--ink-3)}
.yr{font-family:var(--display);font-size:24px;font-weight:700;line-height:1;min-width:92px}
.flag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;border-radius:2px;border:1px solid var(--rule);color:var(--ink-3)}
.flag.th{border-color:var(--c2);color:var(--c2)}
.timeline{display:grid;gap:0;margin:4px 0}
.tl{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:8px 0;border-bottom:1px dotted var(--rule)}
.tl span:first-child{font-family:var(--mono);font-size:12.5px;color:var(--accent-ink)}
@media (max-width:540px){.tl{grid-template-columns:1fr;gap:0}}
.story p{max-width:70ch;color:var(--ink-2);margin-bottom:10px}
.grade{border:1px solid var(--rule);border-radius:6px;padding:14px;background:var(--page-2);display:flex;flex-direction:column;gap:8px}

/* tables */
.rosetta{width:100%;border-collapse:collapse;font-size:14.5px}
.rosetta th{text-align:left;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--rule)}
.rosetta td{padding:9px 10px;border-bottom:1px dotted var(--rule);vertical-align:top}
.rosetta td:first-child{font-weight:600;min-width:150px}
.rosetta td:last-child{color:var(--c2)}

/* lab */
.lab{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px}
@media (max-width:760px){.lab{grid-template-columns:minmax(0,1fr)}}
.readouts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.ro{border:1px solid var(--rule);border-radius:4px;padding:10px 12px;background:var(--page-2)}
.ro .v{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.chip{display:inline-block;font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:2px;border:1px solid var(--rule)}
.chip.ok{border-color:var(--good);color:var(--good);background:var(--good-wash)}
.chip.no{border-color:var(--bad);color:var(--bad);background:var(--bad-wash)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--sunk);border-radius:2px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--hue,var(--accent));transition:width .35s}
svg text{font-family:var(--mono)}

/* chat */
.fab{position:fixed;right:16px;bottom:16px;z-index:70;display:flex;gap:8px;align-items:center;padding:10px 16px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--page);cursor:pointer;box-shadow:var(--shadow);font-weight:600}
.chat{position:fixed;right:16px;bottom:70px;z-index:70;width:min(420px,calc(100vw - 32px));height:min(600px,calc(100vh - 110px));display:flex;flex-direction:column;background:var(--page);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow)}
.chat-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule)}
.chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:90%;padding:8px 12px;border-radius:6px;font-size:15px;white-space:pre-wrap;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--accent-wash);color:var(--ink)}
.msg.them{align-self:flex-start;background:var(--page-2);border:1px solid var(--rule-soft)}
.msg.sys{align-self:center;font-size:12.5px;color:var(--ink-3);background:none;padding:0}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.quick button{font-size:12.5px;padding:4px 8px;border:1px solid var(--rule);border-radius:999px;background:var(--page);cursor:pointer}
.chat-f{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--rule)}
.chat-f textarea{min-height:40px;height:40px}

/* companion: Satang */
.sat{position:fixed;left:0;top:0;z-index:75;width:66px;height:66px;will-change:transform;pointer-events:none}
.sat-body{pointer-events:auto;width:100%;height:100%;padding:0;border:0;background:none;cursor:grab;touch-action:none;display:block;border-radius:50%}
.sat.held .sat-body{cursor:grabbing}
.sat-svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 7px rgba(0,0,0,.2));animation:satbob 3.2s ease-in-out infinite}
@keyframes satbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sat .wing{transform-box:fill-box;animation:flapL .45s ease-in-out infinite alternate}
.sat .wl{transform-origin:100% 50%}
.sat .wr{transform-origin:0% 50%;animation-name:flapR}
@keyframes flapL{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
@keyframes flapR{from{transform:rotate(12deg)}to{transform:rotate(-14deg)}}
.sat .mouth{display:none}
.mood-happy .m-happy,.mood-smug .m-smug,.mood-fluster .m-fluster,.mood-sad .m-sad,.mood-intense .m-intense{display:inline}
.sat.hop .sat-body{animation:sathop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes sathop{0%{transform:scale(1)}30%{transform:scale(1.16) translateY(-8px)}100%{transform:scale(1)}}
.sat-body:hover .sat-svg{animation-duration:1.2s}
@media (max-width:560px){.sat{width:54px;height:54px}}
@media (prefers-reduced-motion:reduce){.sat-svg,.sat .wing{animation:none}}
.sat-bubble{position:fixed;left:0;top:0;z-index:76;background:var(--page);color:var(--ink);border:1.5px solid var(--sat-line);border-radius:12px;box-shadow:var(--shadow);padding:8px 12px 12px;font-size:14.5px;line-height:1.5}
.sat-bubble.pop{animation:satpop .28s cubic-bezier(.3,1.5,.5,1)}
@keyframes satpop{from{transform:scale(.92) translateY(6px)}to{transform:none}}
.sat-b-h{display:flex;align-items:center;gap:8px}
.sat-b-t b{color:var(--sat-text)}
.sat-x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:13px;padding:2px 4px}
.sat-bubble .btn{padding:4px 10px;font-size:13px}
.sat-chat{position:fixed;left:0;top:0;z-index:74;display:flex;flex-direction:column;background:var(--page);border:1.5px solid var(--sat-line);border-radius:12px;box-shadow:var(--shadow)}
.sat-chat.sheet{left:8px!important;right:8px;top:auto!important;bottom:8px;width:auto!important;height:72vh!important}
.sat-chat-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--rule)}
.sat-face{color:var(--sat-text);font-size:13px}

/* tiers, sources, filters, sorters */
.tier{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:2px;border:1px solid;white-space:nowrap}
.tier.e{color:var(--good);border-color:var(--good);background:var(--good-wash)}
.tier.m{color:var(--sat-text);border-color:var(--sat-line);background:var(--sat-soft)}
.tier.d{color:var(--bad);border-color:var(--bad);background:var(--bad-wash)}
.src{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);border:1px dashed var(--rule);padding:1px 6px;border-radius:2px;white-space:nowrap}
.filter{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filter .btn{padding:5px 11px;font-size:13.5px}
.filter .btn[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.tierstats{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.helpers{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.helpers .btn{padding:5px 10px;font-size:13px;border-color:var(--sat-line)}
.sorter{border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.sorter-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--page-2);border-bottom:1px solid var(--rule)}
.sorter-card{padding:22px 18px;font-size:18px;line-height:1.45;min-height:96px}
.sorter-sides{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 16px}
.sorter-why{margin:0 18px 16px}

.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--page);padding:8px 14px;border-radius:4px;font-size:14px;font-family:var(--mono);animation:rise .3s ease}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
</style>
